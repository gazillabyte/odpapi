LoadModule odpapi_scsi_module /etc/httpd/modules/mod_odpapi_scsi.so

SCSIChangerDevice /dev/sch0 00000000-0000-5000-8000-000000000001 LTO

<Location /dpapi-v1>
    SetHandler scsi-adapter
    Require all granted
</Location>

<Location /dpapi-v1/query.json>
    SetHandler scsi-adapter
    Require all granted
</Location>

<Location /dpapi-v1/list.json>
    SetHandler scsi-adapter
    Require all granted
</Location>

<Location /dpapi-v1/find.json>
    SetHandler scsi-adapter
    Require all granted
</Location>

<Location /dpapi-v1/inventory.json>
    SetHandler scsi-adapter
    Require all granted
</Location>

